  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beerpong Liga</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f5f4f0;--surface:#fff;--border:#e2e0d8;--border2:#cccac0;
      --text:#1a1917;--muted:#6b6960;--faint:#9b9890;
      --blue:#3a6fd8;--blue-bg:#eef2fc;--blue-text:#1e3f80;
      --green:#2a7a4b;--green-bg:#e8f5ee;--green-text:#164d2e;
      --gray-bg:#f0ede6;--gray-text:#4a4843;
      --r:8px;--rl:12px;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;color:var(--text);background:var(--bg);min-height:100vh}
    .topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 16px;height:56px;overflow-x:auto}
    .topbar-brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;white-space:nowrap}
    .topbar-nav{display:flex;gap:0;flex:1}
    .nav-btn{padding:6px 10px;border:none;background:none;cursor:pointer;font-size:13px;font-family:inherit;color:var(--muted);border-radius:var(--r);border-bottom:2px solid transparent;white-space:nowrap}
    .nav-btn:hover{color:var(--text);background:var(--bg)}
    .nav-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
    .topbar-user{display:flex;align-items:center;gap:8px;white-space:nowrap}
    .user-name{font-size:13px;color:var(--muted)}
    .lang-bar{position:fixed;top:10px;right:14px;z-index:999;display:flex;gap:4px}
    .lang-btn{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--muted)}
    .lang-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;cursor:pointer}
    .btn:hover{background:var(--bg)}
    .btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .btn-primary:hover{background:#2d5ab5}
    .btn-ghost{border-color:transparent;background:transparent}
    .btn-ghost:hover{background:var(--bg)}
    .btn-sm{padding:5px 10px;font-size:13px}
    .btn-full{width:100%;justify-content:center}
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
    .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:2.5rem 2rem;width:380px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
    .login-logo{font-size:48px;text-align:center;margin-bottom:8px}
    .login-title{font-size:22px;font-weight:600;text-align:center}
    .login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px}
    .role-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
    .role-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 12px;border:2px solid var(--border);border-radius:var(--rl);background:var(--bg);cursor:pointer;font-family:inherit}
    .role-btn:hover,.role-btn.active{border-color:var(--blue);background:var(--blue-bg)}
    .role-icon{font-size:32px}
    .role-label{font-size:14px;font-weight:600;color:var(--text)}
    .content{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.07)}
    .card-title{font-size:16px;font-weight:600;margin-bottom:4px}
    .card-desc{font-size:13px;color:var(--muted);margin-bottom:16px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
    .field-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
    .field-row label{font-size:13px;color:var(--muted);min-width:160px}
    input,select{padding:8px 11px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);width:220px}
    input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,111,216,.12)}
    input[type=date]{width:170px}
    .err-msg{color:#c0392b;font-size:13px;margin-bottom:10px}
    .notice{background:#fef9ec;border:1px solid #f0d060;border-radius:var(--r);padding:10px 14px;font-size:13px;color:#7a5c00;margin:10px 0 14px}
    .pw-display{display:flex;align-items:center;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);min-width:160px}
    .pw-value{font-family:monospace;font-size:15px;font-weight:600;color:var(--blue);letter-spacing:1px}
    .pw-empty{font-size:13px;color:var(--faint);font-style:italic}
    .prio-list{display:flex;flex-direction:column;gap:6px}
    .prio-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:grab;user-select:none}
    .prio-handle{font-size:16px;color:var(--faint)}
    .prio-label{flex:1;font-size:14px}
    .prio-rank{font-size:12px;color:var(--faint)}
    .teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:600px){.teams-grid{grid-template-columns:1fr}}
    .team-col{background:var(--bg);border-radius:var(--r);padding:14px;border:1px solid var(--border)}
    .team-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .team-header input{width:100%;min-width:0;flex:1}
    .player-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .player-row input,.player-row select{width:100%;min-width:0;flex:1}
    .player-num{font-size:12px;color:var(--muted);min-width:18px;text-align:right}
    .double-block{margin-bottom:12px}
    .double-label{margin-bottom:4px}
    .double-inputs{display:flex;gap:8px;flex-wrap:wrap}
    .double-inputs select{flex:1;min-width:100px;width:auto}
    .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
    .tag-blue{background:var(--blue-bg);color:var(--blue-text)}
    .tag-green{background:var(--green-bg);color:var(--green-text)}
    .avail-table{width:100%;border-collapse:collapse;font-size:13px}
    .avail-table th{text-align:left;padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
    .avail-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
    .avail-table tr:last-child td{border-bottom:none}
    .avail-table td:first-child{font-weight:500;white-space:nowrap;min-width:110px}
    .time-slots{display:flex;flex-wrap:wrap;gap:4px}
    .time-slot{padding:3px 8px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--muted);user-select:none}
    .time-slot:hover{border-color:var(--blue);color:var(--blue)}
    .time-slot.on{background:var(--blue);color:#fff;border-color:var(--blue)}
    .match-table{width:100%;border-collapse:collapse;font-size:13px}
    .match-table th{text-align:left;padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border)}
    .match-table td{padding:9px 10px;border-bottom:1px solid var(--border)}
    .match-table tr:last-child td{border-bottom:none}
    .vs-cell{text-align:center;color:var(--faint)}
    .date-cell{white-space:nowrap;color:var(--muted)}
    .empty-state{color:var(--muted);font-size:14px;padding:12px 0}
    .toast{position:fixed;bottom:24px;right:24px;background:#1a1917;color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999}
    .toast-err{background:#c0392b}
    .gantt-day{margin-bottom:28px}
    .gantt-title{font-size:15px;font-weight:700;margin-bottom:10px;padding:8px 14px;background:var(--blue-bg);border-left:4px solid var(--blue);border-radius:var(--r);color:var(--blue-text)}
    .gantt-row{display:flex;align-items:center;margin-bottom:5px;width:100%}
    .gantt-label{flex:0 0 15%;min-width:0;display:flex;align-items:center;gap:4px;padding-right:6px;overflow:hidden}
    .gantt-slots{flex:1;display:flex;gap:2px;min-width:0}
    .gantt-slot{flex:1;min-width:0;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;border:1px solid transparent;overflow:hidden;padding:0 2px;text-align:center;line-height:1.2}
    .gantt-slot:hover{filter:brightness(0.93)}
    .gantt-btn{flex:0 0 110px;min-width:0;padding-left:6px;display:flex;gap:4px;align-items:center}
    @media(max-width:600px){.gantt-label{flex:0 0 20%}.gantt-btn{flex:0 0 80px}.gantt-slot{font-size:8px}}
  </style>
</head>

// ── Timezone helper ───────────────────────────────────────────
function pad(n){ return n<10?"0"+n:String(n); }

function slotToLocal(slot, dateStr, tz) {
  if(!tz || tz==="Europe/Berlin") return slot;
  try {
    const [h,m] = slot.split(":").map(Number);
    const dt = new Date(dateStr + "T" + pad(h) + ":" + pad(m) + ":00");
    const berlinStr = dt.toLocaleString("sv-SE", {timeZone:"Europe/Berlin"});
    const localStr  = dt.toLocaleString("sv-SE", {timeZone:tz});
    const berlinMs  = new Date(berlinStr).getTime();
    const localMs   = new Date(localStr).getTime();
    const diffMs    = localMs - berlinMs;
    const totalMin  = h*60 + m + Math.round(diffMs/60000);
    const norm      = ((totalMin % 1440) + 1440) % 1440;
    return pad(Math.floor(norm/60)) + ":" + pad(norm%60);
  } catch(e) { return slot; }
}

// ── Helpers ───────────────────────────────────────────────────
const DAY = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const dn  = d => DAY[d.getDay()];
const fmt = d => d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
const fmtFull = d => d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});

function getSlots(dayIdx){
  const slots=[], startMin=(dayIdx===0||dayIdx===6)?12*60:17*60;
  for(let m=startMin; m<=23*60; m+=30) slots.push(pad(Math.floor(m/60))+":"+pad(m%60));
  return slots;
}

function getPlayDays(){
  if(!S.settings.startDate) return [];
  const start = new Date(S.settings.startDate);
  return Array.from({length:12},(_,i)=>{ const d=new Date(start); d.setDate(d.getDate()+2+i); return d; });
}

function allPlayers(){
  return [...S.teams.team1.players,...S.teams.team2.players].filter(p=>p.trim());
}

function buildMatches(){
  const t1=S.teams.team1, t2=S.teams.team2, m=[];
  for(let i=0;i<8;i++) m.push({id:"E"+(i+1),type:"Einzel",p1:t1.players[i]||"Spieler "+(i+1),p2:t2.players[i]||"Spieler "+(i+1)});
  for(let i=0;i<4;i++){
    const d1=S.doubles.team1[i], d2=S.doubles.team2[i];
    m.push({id:"D"+(i+1),type:"Doppel",
      p1:(d1[0]||"S"+(2*i+1))+" & "+(d1[1]||"S"+(2*i+2)),
      p2:(d2[0]||"S"+(2*i+1))+" & "+(d2[1]||"S"+(2*i+2))});
  }
  return m;
}

function getPossibleSlots(m){
  const days=getPlayDays(), result=[];
  const p1n = m.p1.includes(" & ") ? m.p1.split(" & ") : [m.p1];
  const p2n = m.p2.includes(" & ") ? m.p2.split(" & ") : [m.p2];
  const names = [...p1n,...p2n].map(n=>n.trim()).filter(n=>n);
  days.forEach(d=>{
    const ds = d.toISOString().slice(0,10);
    const slots = getSlots(d.getDay());
    const common = slots.filter(sl=>names.every(name=>((S.availability[name]||{})[ds]||[]).includes(sl)));
    if(common.length>0) result.push({date:d,ds,slots:common});
  });
  return result;
}

function getMatchesByDay(){
  const days=getPlayDays(), matches=buildMatches(), byDay={};
  const prio = S.settings.dayPriority;
  days.forEach(d=>{
    const ds=d.toISOString().slice(0,10);
    matches.forEach(m=>{
      const p=getPossibleSlots(m).find(x=>x.ds===ds);
      if(p){ if(!byDay[ds])byDay[ds]={date:d,matches:[]}; byDay[ds].matches.push({m,slots:p.slots}); }
    });
  });
  return Object.entries(byDay).sort((a,b)=>{
    const da=new Date(a[0]),db=new Date(b[0]);
    const ai=prio.indexOf(DAY[da.getDay()]),bi=prio.indexOf(DAY[db.getDay()]);
    if(ai!==bi) return (ai<0?99:ai)-(bi<0?99:bi);
    return a[0].localeCompare(b[0]);
  }).map(([ds,v])=>({ds,...v}));
}

}

// ── Spieler: Verfügbarkeit ────────────────────────────────────
function rSpielerAvail(){
  const days=getPlayDays(), players=allPlayers();
  let html = hdr("verfuegbarkeit")+'<main class="content"><section class="card">';
  html += '<h2 class="card-title">'+t("yourAvail")+'</h2>';
  html += '<p class="card-desc">'+t("availDesc")+'</p>';

        +'<select id="spieler-name" onchange="onSpielerSelect(this.value)" style="width:220px">'
        +'<option value="">'+t("chooseName")+'</option>';
  players.forEach(p=>{ html += '<option value="'+p+'"'+(selectedSpieler===p?" selected":"")+">"+p+"</option>"; });
  html += '</select></div>';

  if(selectedSpieler){
    const curTz = playerTimezones[selectedSpieler]||"Europe/Berlin";
    const tzOpts = TIMEZONES.map(tz=>'<option value="'+tz.value+'"'+(curTz===tz.value?" selected":"")+">"+tz.label+"</option>").join("");
    html += '<div class="field-row"><label>'+t("yourTz")+'</label>'
          +'<select onchange="setPlayerTz(this.value)" style="width:280px">'+tzOpts+'</select></div>';
  }

  if(selectedSpieler && days.length>0){
    const curTz = playerTimezones[selectedSpieler]||"Europe/Berlin";
    const avData = S.availability[selectedSpieler]||{};
    let totalSlots=0, totalDays=0;
    days.forEach(d=>{ const cnt=(avData[d.toISOString().slice(0,10)]||[]).length; if(cnt>0){totalSlots+=cnt;totalDays++;} });
    if(totalSlots>0) html += '<p style="font-size:13px;color:var(--muted);margin-bottom:12px">'+t("totalSlots")+' <strong style="color:var(--text)">'+totalSlots+' '+t("slotsOn")+'</strong> <strong style="color:var(--text)">'+totalDays+' '+t("days")+'</strong></p>';

    html += '<div style="overflow-x:auto"><table class="avail-table"><thead><tr><th>Tag</th><th>'+t("nav_avail")+'</th></tr></thead><tbody>';
    days.forEach(d=>{
      const ds=d.toISOString().slice(0,10);
      const slots=getSlots(d.getDay());
      const sel=(S.availability[selectedSpieler]||{})[ds]||[];
      html += '<tr><td><strong>'+dn(d)+'</strong><br><span style="font-size:11px;color:var(--muted)">'+fmt(d)+'</span></td><td><div class="time-slots">';
      slots.forEach(sl=>{
        const local = slotToLocal(sl, ds, curTz);
        html += '<span class="time-slot'+(sel.includes(sl)?" on":"")+'" onclick="toggleSlot(\''+ds+'\',\''+sl+'\')">'+local+'</span>';
      });
      html += '</div></td></tr>';
    });
    html += '</tbody></table></div>';
  } else if(!selectedSpieler){
    html += '<p class="empty-state">'+t("selectName")+'</p>';
  } else {
    html += '<p class="empty-state">'+t("noStartAdmin")+'</p>';
  }
  html += '</section></main>';
  document.getElementById("root").innerHTML = html;
}
function onSpielerSelect(name){
  selectedSpieler = name;
  userTimezone = playerTimezones[name]||"Europe/Berlin";
  rSpielerAvail();
}
function setPlayerTz(tz){
  userTimezone = tz;
  if(selectedSpieler) playerTimezones[selectedSpieler]=tz;
  rSpielerAvail();
}
function toggleSlot(ds,time){
  if(!selectedSpieler)return;
  if(!S.availability[selectedSpieler]) S.availability[selectedSpieler]={};
  if(!S.availability[selectedSpieler][ds]) S.availability[selectedSpieler][ds]=[];
  const arr=S.availability[selectedSpieler][ds];
  const idx=arr.indexOf(time);
  if(idx>=0)arr.splice(idx,1); else arr.push(time);
  rSpielerAvail(); push();
}

// ── Gantt ─────────────────────────────────────────────────────
function renderGanttDay(ds, date, matchRows, showAssign){
  let html = '<div class="gantt-day"><div class="gantt-title">'+fmtFull(date)+'</div>';
  matchRows.forEach(({m,slots})=>{
    const isAss  = S.matchAssignments[m.id]===ds;
    const picked = S.matchSlots[m.id];
    const bg  = isAss?"#dce8fb":(m.type==="Einzel"?"#d0eddc":"#faeeda");
    const bdr = isAss?"#3a6fd8":(m.type==="Einzel"?"#3dab6b":"#c8860a");
    const txt = isAss?"#1a4fa0":(m.type==="Einzel"?"#164d2e":"#633806");
    html += '<div class="gantt-row">';
    html += '<div class="gantt-label"><span class="tag '+(m.type==="Einzel"?"tag-blue":"tag-green")+'">'+m.id+'</span>';
    html += '<span style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65px" title="'+m.p1+' vs '+m.p2+'">'+m.p1.split(" & ")[0].split(" ")[0]+'</span>';
    if(isAss) html += '<span style="color:#3a6fd8;font-size:11px;font-weight:700">✓</span>';
    html += '</div><div class="gantt-slots">';
    slots.forEach(sl=>{
      const isSel = isAss && picked===sl;
      html += '<div class="gantt-slot" style="background:'+(isSel?"#3a6fd8":bg)+';border-color:'+(isSel?"#1a4fa0":bdr)+';color:'+(isSel?"#fff":txt)+';cursor:'+(showAssign?"pointer":"default")+'"';
      if(showAssign) html += ' onclick="pickSlot(\''+m.id+'\',\''+ds+'\',\''+sl+'\')" title="'+sl+' Uhr"';
      html += '>'+sl+'</div>';
    });
    html += '</div>';
    if(showAssign){
      html += '<div class="gantt-btn">';
      if(isAss){
        html += '<span style="font-size:11px;color:#3a6fd8;font-weight:600;white-space:nowrap">'+(picked?picked+" "+t("hour"):"–")+'</span>';
        html += '<button class="btn btn-sm" style="background:#c0392b;color:#fff;border-color:#c0392b;font-size:11px;padding:3px 7px" onclick="unpickSlot(\''+m.id+'\')">✕</button>';
      } else {
        html += '<span style="font-size:11px;color:var(--faint)">← '+t("choose")+'</span>';
      }
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}
function pickSlot(mid,day,time){ S.matchAssignments[mid]=day; S.matchSlots[mid]=time; push().then(()=>rAdminPlan()); }
function unpickSlot(mid){ delete S.matchAssignments[mid]; delete S.matchSlots[mid]; push().then(()=>rAdminPlan()); }

// ── Admin: Doppel ─────────────────────────────────────────────
function rAdminDoppel(){
  const days=getPlayDays(), d1=S.doubles.team1, d2=S.doubles.team2;
  let html = hdr("doppel")+'<main class="content"><section class="card">';
  html += '<h2 class="card-title">'+t("doublesAvail")+'</h2>';
  html += '<p class="card-desc">'+t("doublesAvailDesc")+'</p>';
  html += '<div class="field-row" style="margin-bottom:16px"><label>Doppel</label>'
        +'<select id="doppel-sel" onchange="selectDoppel(this.value)" style="width:auto">'
        +'<option value="">'+t("selectDouble")+'</option>';
  for(let i=0;i<4;i++){
    const names=[...(d1[i]||[]),...(d2[i]||[])].filter(p=>p).join(", ")||t("noPlayers");
    html += '<option value="D'+(i+1)+'"'+(selectedDoppel==="D"+(i+1)?" selected":"")+'>D'+(i+1)+' — '+names+'</option>';
  }
  html += '</select></div>';

  if(selectedDoppel && days.length>0){
    const dIdx=parseInt(selectedDoppel.slice(1))-1;
    const allP=[...(d1[dIdx]||[]),...(d2[dIdx]||[])].filter(p=>p);
    const total=allP.length;
    html += '<div style="margin-bottom:12px;font-size:13px"><strong>'+t("player")+':</strong> '+allP.join(", ")+'</div>';
    if(total===0){ html+='<p class="empty-state">'+t("noPlayers")+'</p>'; }
    else {
      let hasAny=false;
      days.forEach(d=>{
        const ds=d.toISOString().slice(0,10);
        const slotData=getSlots(d.getDay()).map(sl=>{
          const can=allP.filter(p=>((S.availability[p]||{})[ds]||[]).includes(sl));
          const cant=allP.filter(p=>!((S.availability[p]||{})[ds]||[]).includes(sl));
          return {sl,can,cant};
        }).filter(x=>x.can.length>=3);
        if(slotData.length===0)return;
        hasAny=true;
        html += '<div style="margin-bottom:16px"><div style="font-weight:600;font-size:14px;margin-bottom:6px;color:var(--blue-text)">'+dn(d)+', '+fmt(d)+'</div>';
        slotData.forEach(({sl,can,cant})=>{
          const allCan=cant.length===0;
          const bg=allCan?"#d0eddc":"#faeeda", bdr=allCan?"#3dab6b":"#c8860a";
          html += '<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid '+bdr+';border-radius:6px;background:'+bg+';margin-bottom:5px;flex-wrap:wrap">';
          html += '<span style="font-weight:700;font-size:13px;min-width:50px">'+sl+'</span>';
          html += '<span style="font-size:11px;padding:1px 7px;border-radius:20px;font-weight:600;background:'+bg+';color:'+(allCan?"#164d2e":"#633806")+'">'+can.length+'/'+total+'</span>';
          if(cant.length>0) html+='<span style="font-size:12px;color:#7a5c00">'+t("missing")+' <strong>'+cant.join(", ")+'</strong></span>';
          else html+='<span style="font-size:12px;color:#164d2e">'+t("allFree")+'</span>';
          html += '</div>';
        });
        html += '</div>';
      });
      if(!hasAny) html+='<p class="empty-state">'+t("noAvail")+'</p>';
    }
  } else if(!selectedDoppel){ html+='<p class="empty-state">'+t("chooseDouble")+'</p>'; }
  else{ html+='<p class="empty-state">'+t("noStart")+'</p>'; }
  html += '</section></main>';
  document.getElementById("root").innerHTML = html;
}
function selectDoppel(val){ selectedDoppel=val; rAdminDoppel(); }

// ── Alle Spiele ───────────────────────────────────────────────
function rSpiele(){
  const matches=buildMatches();
  function tbl(list){
    let html='<table class="match-table"><thead><tr><th>#</th><th>'+S.teams.team1.name+'</th><th></th><th>'+S.teams.team2.name+'</th><th>'+t("matchTime")+'</th></tr></thead><tbody>';
    list.forEach(m=>{
      const ds=S.matchAssignments[m.id], d=ds?new Date(ds):null;
      const slot=S.matchSlots[m.id];
      let timeStr=t("noDate");
      if(d) timeStr=dn(d).slice(0,2)+". "+fmt(d)+(slot?", "+slot+" "+t("hour"):"");
      html+='<tr><td><span class="tag '+(m.type==="Einzel"?"tag-blue":"tag-green")+'">'+m.id+'</span></td>'
          +'<td>'+m.p1+'</td><td class="vs-cell">vs</td><td>'+m.p2+'</td>'
          +'<td class="date-cell">'+timeStr+'</td></tr>';
    });
    return html+'</tbody></table>';
  }
  document.getElementById("root").innerHTML = hdr("spiele")+'<main class="content">'
    +'<section class="card"><h2 class="card-title">'+t("singles")+'</h2>'+tbl(matches.filter(m=>m.type==="Einzel"))+'</section>'
    +'<section class="card"><h2 class="card-title">'+t("doublesGames")+'</h2>'+tbl(matches.filter(m=>m.type==="Doppel"))+'</section></main>';
}

// ── Boot ──────────────────────────────────────────────────────
rLogin();
</script>
