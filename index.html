<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beerpong Liga</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f5f4f0;--surface:#fff;--border:#e2e0d8;--border2:#cccac0;--text:#1a1917;--muted:#6b6960;--faint:#9b9890;--blue:#3a6fd8;--blue-bg:#eef2fc;--blue-text:#1e3f80;--green:#2a7a4b;--green-bg:#e8f5ee;--green-text:#164d2e;--gray-bg:#f0ede6;--gray-text:#4a4843;--r:8px;--rl:12px}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;color:var(--text);background:var(--bg);min-height:100vh}
    .topbar{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 16px;height:56px;overflow-x:auto}
    .topbar-brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;white-space:nowrap}
    .topbar-nav{display:flex;gap:0;flex:1}
    .nav-btn{padding:6px 10px;border:none;background:none;cursor:pointer;font-size:13px;font-family:inherit;color:var(--muted);border-radius:var(--r);border-bottom:2px solid transparent;white-space:nowrap}
    .nav-btn:hover{color:var(--text);background:var(--bg)}
    .nav-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
    .topbar-user{display:flex;align-items:center;gap:8px;white-space:nowrap}
    .user-name{font-size:13px;color:var(--muted)}
    .lang-bar{position:fixed;top:10px;right:12px;z-index:999}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;cursor:pointer}
    .btn:hover{background:var(--bg)}
    .btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .btn-primary:hover{background:#2d5ab5}
    .btn-ghost{border-color:transparent;background:transparent}
    .btn-ghost:hover{background:var(--bg)}
    .btn-sm{padding:5px 10px;font-size:13px}
    .btn-full{width:100%;justify-content:center}
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center}
    .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:2.5rem 2rem;width:380px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
    .login-logo{font-size:48px;text-align:center;margin-bottom:8px}
    .login-title{font-size:22px;font-weight:600;text-align:center}
    .login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px}
    .role-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
    .role-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 12px;border:2px solid var(--border);border-radius:var(--rl);background:var(--bg);cursor:pointer;font-family:inherit}
    .role-btn:hover,.role-btn.active{border-color:var(--blue);background:var(--blue-bg)}
    .role-icon{font-size:32px}
    .role-label{font-size:14px;font-weight:600;color:var(--text)}
    .content{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(0,0,0,.07)}
    .card-title{font-size:16px;font-weight:600;margin-bottom:4px}
    .card-desc{font-size:13px;color:var(--muted);margin-bottom:16px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
    .field-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
    .field-row label{font-size:13px;color:var(--muted);min-width:160px}
    input,select{padding:8px 11px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);width:220px}
    input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,111,216,.12)}
    input[type=date]{width:170px}
    .err-msg{color:#c0392b;font-size:13px;margin-bottom:10px}
    .notice{background:#fef9ec;border:1px solid #f0d060;border-radius:var(--r);padding:10px 14px;font-size:13px;color:#7a5c00;margin:10px 0 14px}
    .pw-display{display:flex;align-items:center;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);min-width:160px}
    .pw-value{font-family:monospace;font-size:15px;font-weight:600;color:var(--blue);letter-spacing:1px}
    .pw-empty{font-size:13px;color:var(--faint);font-style:italic}
    .prio-list{display:flex;flex-direction:column;gap:6px}
    .prio-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:grab;user-select:none}
    .prio-handle{font-size:16px;color:var(--faint)}
    .prio-label{flex:1;font-size:14px}
    .prio-rank{font-size:12px;color:var(--faint)}
    .teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:600px){.teams-grid{grid-template-columns:1fr}}
    .team-col{background:var(--bg);border-radius:var(--r);padding:14px;border:1px solid var(--border)}
    .team-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .team-header input{width:100%;min-width:0;flex:1}
    .player-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .player-row input,.player-row select{width:100%;min-width:0;flex:1}
    .player-num{font-size:12px;color:var(--muted);min-width:18px;text-align:right}
    .double-block{margin-bottom:12px}
    .double-label{margin-bottom:4px}
    .double-inputs{display:flex;gap:8px;flex-wrap:wrap}
    .double-inputs select{flex:1;min-width:100px;width:auto}
    .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
    .tag-blue{background:var(--blue-bg);color:var(--blue-text)}
    .tag-green{background:var(--green-bg);color:var(--green-text)}
    .avail-table{width:100%;border-collapse:collapse;font-size:13px}
    .avail-table th{text-align:left;padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
    .avail-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
    .avail-table tr:last-child td{border-bottom:none}
    .avail-table td:first-child{font-weight:500;white-space:nowrap;min-width:110px}
    .time-slots{display:flex;flex-wrap:wrap;gap:4px}
    .time-slot{padding:3px 8px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--muted);user-select:none}
    .time-slot:hover{border-color:var(--blue);color:var(--blue)}
    .time-slot.on{background:var(--blue);color:#fff;border-color:var(--blue)}
    .match-table{width:100%;border-collapse:collapse;font-size:13px}
    .match-table th{text-align:left;padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border)}
    .match-table td{padding:9px 10px;border-bottom:1px solid var(--border)}
    .match-table tr:last-child td{border-bottom:none}
    .vs-cell{text-align:center;color:var(--faint)}
    .date-cell{white-space:nowrap;color:var(--muted)}
    .empty-state{color:var(--muted);font-size:14px;padding:12px 0}
    .toast{position:fixed;bottom:24px;right:24px;background:#1a1917;color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999}
    .toast-err{background:#c0392b}
    .gantt-day{margin-bottom:28px}
    .gantt-title{font-size:15px;font-weight:700;margin-bottom:10px;padding:8px 14px;background:var(--blue-bg);border-left:4px solid var(--blue);border-radius:var(--r);color:var(--blue-text)}
    .gantt-row{display:flex;align-items:center;margin-bottom:5px;width:100%}
    .gantt-label{flex:0 0 15%;min-width:0;display:flex;align-items:center;gap:4px;padding-right:6px;overflow:hidden}
    .gantt-slots{flex:1;display:flex;gap:2px;min-width:0}
    .gantt-slot{flex:1;min-width:0;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;border:1px solid transparent;overflow:hidden;padding:0 2px;text-align:center}
    .gantt-slot:hover{filter:brightness(0.93)}
    .gantt-btn{flex:0 0 110px;min-width:0;padding-left:6px;display:flex;gap:4px;align-items:center}
    @media(max-width:600px){.gantt-label{flex:0 0 20%}.gantt-btn{flex:0 0 80px}.gantt-slot{font-size:8px}}
  </style>
</head>

function pad(n){return n<10?"0"+n:String(n);}

function slotToLocal(slot,dateStr,tz){
  if(!tz||tz==="Europe/Berlin")return slot;
  try{
    const[h,m]=slot.split(":").map(Number);
    const dt=new Date(dateStr+"T"+pad(h)+":"+pad(m)+":00");
    const bs=dt.toLocaleString("sv-SE",{timeZone:"Europe/Berlin"});
    const ls=dt.toLocaleString("sv-SE",{timeZone:tz});
    const diff=(new Date(ls)-new Date(bs));
    const total=h*60+m+Math.round(diff/60000);
    const norm=((total%1440)+1440)%1440;
    return pad(Math.floor(norm/60))+":"+pad(norm%60);
  }catch(e){return slot;}
}

const DAY=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

function getSlots(di){const s=[],st=(di===0||di===6)?12*60:17*60;for(let m=st;m<=23*60;m+=30)s.push(pad(Math.floor(m/60))+":"+pad(m%60));return s;}
function getPlayDays(){if(!S.settings.startDate)return[];const st=new Date(S.settings.startDate);return Array.from({length:12},(_,i)=>{const d=new Date(st);d.setDate(d.getDate()+2+i);return d;});}
function allPlayers(){return[...S.teams.team1.players,...S.teams.team2.players].filter(p=>p.trim());}
function buildMatches(){const t1=S.teams.team1,t2=S.teams.team2,m=[];for(let i=0;i<8;i++)m.push({id:"E"+(i+1),type:"Einzel",p1:t1.players[i]||"Spieler "+(i+1),p2:t2.players[i]||"Spieler "+(i+1)});for(let i=0;i<4;i++){const d1=S.doubles.team1[i],d2=S.doubles.team2[i];m.push({id:"D"+(i+1),type:"Doppel",p1:(d1[0]||"S"+(2*i+1))+" & "+(d1[1]||"S"+(2*i+2)),p2:(d2[0]||"S"+(2*i+1))+" & "+(d2[1]||"S"+(2*i+2))});}return m;}
function getPossibleSlots(m){const days=getPlayDays(),res=[];const p1n=m.p1.includes(" & ")?m.p1.split(" & "):[m.p1];const p2n=m.p2.includes(" & ")?m.p2.split(" & "):[m.p2];const names=[...p1n,...p2n].map(n=>n.trim()).filter(n=>n);days.forEach(d=>{const ds=d.toISOString().slice(0,10);const slots=getSlots(d.getDay());const common=slots.filter(sl=>names.every(name=>((S.availability[name]||{})[ds]||[]).includes(sl)));if(common.length>0)res.push({date:d,ds,slots:common});});return res;}
function getMatchesByDay(){const days=getPlayDays(),matches=buildMatches(),byDay={},prio=S.settings.dayPriority;days.forEach(d=>{const ds=d.toISOString().slice(0,10);matches.forEach(m=>{const p=getPossibleSlots(m).find(x=>x.ds===ds);if(p){if(!byDay[ds])byDay[ds]={date:d,matches:[]};byDay[ds].matches.push({m,slots:p.slots});}});});return Object.entries(byDay).sort((a,b)=>{const da=new Date(a[0]),db=new Date(b[0]);const ai=prio.indexOf(DAY[da.getDay()]),bi=prio.indexOf(DAY[db.getDay()]);if(ai!==bi)return(ai<0?99:ai)-(bi<0?99:bi);return a[0].localeCompare(b[0]);}).map(([ds,v])=>({ds,...v}));}

    +'<button class="role-btn'+(loginRole==="spieler"?" active":"")+'" onclick="selRole(\'spieler\')"><span class="role-icon">🏓</span><span class="role-label">'+i("pl")+'</span></button>'
    +'</div><div id="pw-section" style="display:'+(loginRole?"block":"none")+'">'
    +'<div class="field"><label>'+(loginRole==="admin"?i("apw"):i("ppw"))+'</label>'
    +'<input id="lp" type="password" placeholder="'+i("pw")+'" style="width:100%" onkeydown="if(event.key===\'Enter\')doLogin()" /></div>'
    +'<p class="err-msg" id="lerr" style="display:none">'+i("wpw")+'</p>'
    +'<button class="btn btn-primary btn-full" onclick="doLogin()">'+i("login")+'</button>'
    +'</div></div></div>';
}
function selRole(r){loginRole=r;rLogin();setTimeout(()=>{const el=document.getElementById("lp");if(el)el.focus();},50);}
async function doLogin(){
  const p=document.getElementById("lp").value;
  if(loginRole==="admin"&&p==="jaaxjaax"){currentUser="admin";await loadData();setView("admin");}
  else if(loginRole==="spieler"){document.getElementById("lp").disabled=true;await loadData();document.getElementById("lp").disabled=false;if(S.settings.spielerPassword&&p===S.settings.spielerPassword){currentUser="Spieler";setView("spieler_avail");}else document.getElementById("lerr").style.display="block";}
  else document.getElementById("lerr").style.display="block";
}
function logout(){currentUser=null;loginRole=null;setView("login");}

function rAdmin(){
  const s=S.settings,t1=S.teams.team1,t2=S.teams.team2,d1=S.doubles.team1,d2=S.doubles.team2;
  let note="";if(s.startDate){const d=new Date(s.startDate);d.setDate(d.getDate()+2);note='<div class="notice">'+i("st")+' <strong>'+fmtFull(d)+'</strong>.</div>';}
  function pO(team,sel){let o='<option value="">'+i("ch")+'</option>';team.players.forEach(p=>{if(p)o+='<option value="'+p+'"'+(sel===p?" selected":"")+">"+p+"</option>";});return o;}
  let h=hdr("einstellungen")+'<main class="content">';
  h+='<section class="card"><h2 class="card-title">'+i("t1")+'</h2>';
  h+='<div class="field-row"><label>'+i("t2")+'</label><input id="spw" type="text" value="'+s.spielerPassword+'" /></div>';
  h+='<div class="field-row"><label>'+i("t3")+'</label><div class="pw-display">'+(s.spielerPassword?'<span class="pw-value">'+s.spielerPassword+'</span>':'<span class="pw-empty">'+i("t4")+'</span>')+'</div></div>';
  h+='<div class="field-row"><label>'+i("t5")+'</label><input id="sd" type="date" value="'+s.startDate+'" /></div>';
  h+=note+'<button class="btn btn-primary" onclick="saveSettings()">'+i("save")+'</button></section>';
  h+='<section class="card"><h2 class="card-title">'+i("p1")+'</h2><p class="card-desc">'+i("p2")+'</p><div class="prio-list">';
  s.dayPriority.forEach((day,idx)=>{h+='<div class="prio-row" draggable="true" data-idx="'+idx+'" ondragstart="dsEv(event)" ondragover="doEv(event)" ondrop="ddEv(event)"><span class="prio-handle">⠿</span><span class="prio-label">'+day+'</span><span class="prio-rank">#'+(idx+1)+'</span></div>';});
  h+='</div><button class="btn btn-primary" style="margin-top:12px" onclick="savePrio()">'+i("save")+'</button></section>';
  h+='<section class="card"><h2 class="card-title">'+i("teams")+'</h2><div class="teams-grid">';
  h+='<div class="team-col"><div class="team-header"><span class="tag tag-blue">'+i("t1l")+'</span><input id="tn1" type="text" value="'+t1.name+'" /></div>';
  t1.players.forEach((p,idx)=>{h+='<div class="player-row"><span class="player-num">'+(idx+1)+'</span><input class="p1" data-i="'+idx+'" type="text" value="'+p+'" placeholder="Spieler '+(idx+1)+'" /></div>';});
  h+='</div><div class="team-col"><div class="team-header"><span class="tag tag-green">'+i("t2l")+'</span><input id="tn2" type="text" value="'+t2.name+'" /></div>';
  t2.players.forEach((p,idx)=>{h+='<div class="player-row"><span class="player-num">'+(idx+1)+'</span><input class="p2" data-i="'+idx+'" type="text" value="'+p+'" placeholder="Spieler '+(idx+1)+'" /></div>';});
  h+='</div></div><button class="btn btn-primary" style="margin-top:14px" onclick="savePlayers()">'+i("spl")+'</button></section>';
  h+='<section class="card"><h2 class="card-title">'+i("dbl")+'</h2><div class="teams-grid">';
  h+='<div class="team-col"><div class="team-header"><span class="tag tag-blue">'+t1.name+'</span></div>';
  [0,1,2,3].forEach(idx=>{h+='<div class="double-block"><div class="double-label"><span class="tag tag-blue">D'+(idx+1)+'</span></div><div class="double-inputs"><select class="d1a" data-i="'+idx+'">'+pO(t1,d1[idx][0])+'</select><select class="d1b" data-i="'+idx+'">'+pO(t1,d1[idx][1])+'</select></div></div>';});
  h+='</div><div class="team-col"><div class="team-header"><span class="tag tag-green">'+t2.name+'</span></div>';
  [0,1,2,3].forEach(idx=>{h+='<div class="double-block"><div class="double-label"><span class="tag tag-green">D'+(idx+1)+'</span></div><div class="double-inputs"><select class="d2a" data-i="'+idx+'">'+pO(t2,d2[idx][0])+'</select><select class="d2b" data-i="'+idx+'">'+pO(t2,d2[idx][1])+'</select></div></div>';});
  h+='</div></div><button class="btn btn-primary" style="margin-top:14px" onclick="saveDoubles()">'+i("sdb")+'</button></section>';
  h+='<section class="card"><h2 class="card-title">'+i("rst")+'</h2><p class="card-desc">'+i("rsd")+'</p><button class="btn" style="background:#c0392b;color:#fff;border-color:#c0392b" onclick="resetAll()">'+i("rsb")+'</button></section></main>';
  document.getElementById("root").innerHTML=h;
}
function saveSettings(){S.settings.spielerPassword=document.getElementById("spw").value;S.settings.startDate=document.getElementById("sd").value;push().then(()=>rAdmin());}
function dsEv(e){dragSrc=parseInt(e.currentTarget.dataset.idx);}
function doEv(e){e.preventDefault();}
function ddEv(e){e.preventDefault();const ti=parseInt(e.currentTarget.dataset.idx);if(dragSrc===null||dragSrc===ti)return;const a=S.settings.dayPriority,item=a.splice(dragSrc,1)[0];a.splice(ti,0,item);dragSrc=null;rAdmin();}
function savePrio(){push().then(()=>toast(i("ps")));}
function savePlayers(){S.teams.team1.name=document.getElementById("tn1").value||"Team A";S.teams.team2.name=document.getElementById("tn2").value||"Team B";document.querySelectorAll(".p1").forEach(el=>S.teams.team1.players[+el.dataset.i]=el.value);document.querySelectorAll(".p2").forEach(el=>S.teams.team2.players[+el.dataset.i]=el.value);push();}
function saveDoubles(){document.querySelectorAll(".d1a").forEach(el=>S.doubles.team1[+el.dataset.i][0]=el.value);document.querySelectorAll(".d1b").forEach(el=>S.doubles.team1[+el.dataset.i][1]=el.value);document.querySelectorAll(".d2a").forEach(el=>S.doubles.team2[+el.dataset.i][0]=el.value);document.querySelectorAll(".d2b").forEach(el=>S.doubles.team2[+el.dataset.i][1]=el.value);push();}
function resetAll(){if(!confirm(i("rsc")))return;S=JSON.parse(JSON.stringify(DEF));push().then(()=>{toast(i("rss"));rAdmin();});}

function rSpielerAvail(){
  const days=getPlayDays(),players=allPlayers();
  let h=hdr("verfuegbarkeit")+'<main class="content"><section class="card"><h2 class="card-title">'+i("av1")+'</h2><p class="card-desc">'+i("av2")+'</p>';
  h+='<div class="field-row"><label>'+i("yn")+'</label><select id="spieler-name" onchange="onSpielerSelect(this.value)" style="width:220px"><option value="">'+i("cn")+'</option>';
  players.forEach(p=>{h+='<option value="'+p+'"'+(selectedSpieler===p?" selected":"")+">"+p+"</option>";});
  h+='</select></div>';
  if(selectedSpieler){
    const curTz=playerTimezones[selectedSpieler]||"Europe/Berlin";
    const tzOpts=TIMEZONES.map(tz=>'<option value="'+tz.v+'"'+(curTz===tz.v?" selected":"")+">"+tz.l+"</option>").join("");
    h+='<div class="field-row"><label>'+i("tz")+'</label><select onchange="setPlayerTz(this.value)" style="width:280px">'+tzOpts+'</select></div>';
  }
  if(selectedSpieler&&days.length>0){
    const curTz=playerTimezones[selectedSpieler]||"Europe/Berlin";
    const avData=S.availability[selectedSpieler]||{};
    let ts=0,td=0;days.forEach(d=>{const c=(avData[d.toISOString().slice(0,10)]||[]).length;if(c>0){ts+=c;td++;}});
    if(ts>0)h+='<p style="font-size:13px;color:var(--muted);margin-bottom:12px">'+i("tot")+' <strong style="color:var(--text)">'+ts+' '+i("son")+' '+td+' '+i("days")+'</strong></p>';
    h+='<div style="overflow-x:auto"><table class="avail-table"><thead><tr><th>Tag</th><th>'+i("s2")+'</th></tr></thead><tbody>';
    days.forEach(d=>{
      const ds=d.toISOString().slice(0,10),slots=getSlots(d.getDay()),sel=(S.availability[selectedSpieler]||{})[ds]||[];
      h+='<tr><td><strong>'+dn(d)+'</strong><br><span style="font-size:11px;color:var(--muted)">'+fmt(d)+'</span></td><td><div class="time-slots">';
      slots.forEach(sl=>{const local=slotToLocal(sl,ds,curTz);h+='<span class="time-slot'+(sel.includes(sl)?" on":"")+'" onclick="toggleSlot(\''+ds+'\',\''+sl+'\')">'+local+'</span>';});
      h+='</div></td></tr>';
    });
    h+='</tbody></table></div>';
  }else if(!selectedSpieler){h+='<p class="empty-state">'+i("sn")+'</p>';}
  else{h+='<p class="empty-state">'+i("na2")+'</p>';}
  h+='</section></main>';
  document.getElementById("root").innerHTML=h;
}
function onSpielerSelect(name){selectedSpieler=name;rSpielerAvail();}
function setPlayerTz(tz){if(selectedSpieler)playerTimezones[selectedSpieler]=tz;rSpielerAvail();}
function toggleSlot(ds,time){if(!selectedSpieler)return;if(!S.availability[selectedSpieler])S.availability[selectedSpieler]={};if(!S.availability[selectedSpieler][ds])S.availability[selectedSpieler][ds]=[];const arr=S.availability[selectedSpieler][ds];const idx=arr.indexOf(time);if(idx>=0)arr.splice(idx,1);else arr.push(time);rSpielerAvail();push();}

function rAdminAvail(){
  const days=getPlayDays(),players=allPlayers();
  let h=hdr("verfuegbarkeit")+'<main class="content"><section class="card"><h2 class="card-title">'+i("ao")+'</h2>';
  if(days.length===0){h+='<p class="empty-state">'+i("ns")+'</p></section></main>';document.getElementById("root").innerHTML=h;return;}
  function cP(p){let s=0,d=0;days.forEach(day=>{const c=((S.availability[p]||{})[day.toISOString().slice(0,10)]||[]).length;if(c>0){s+=c;d++;}});return{s,d};}
  h+='<p style="font-size:12px;color:var(--muted);margin-bottom:10px">'+i("bn")+'</p>';
  h+='<div style="overflow-x:auto"><table class="avail-table"><thead><tr><th>Tag</th>';
  players.forEach(p=>{const c=cP(p);h+='<th>'+p+(c.s>0?'<br><span style="font-size:10px;color:var(--muted);font-weight:400">('+c.s+'/'+c.d+')</span>':'')+'</th>';});
  h+='</tr></thead><tbody>';
  days.forEach(d=>{
    const ds=d.toISOString().slice(0,10);
    h+='<tr><td><strong>'+dn(d)+'</strong><br><span style="font-size:11px;color:var(--muted)">'+fmt(d)+'</span></td>';
    players.forEach(p=>{const avail=(S.availability[p]||{})[ds]||[];if(avail.length===0){h+='<td style="color:var(--faint);font-size:12px">–</td>';}else{h+='<td><div class="time-slots">';avail.sort().forEach(sl=>{h+='<span class="time-slot on" style="cursor:default;font-size:11px">'+sl+'</span>';});h+='</div></td>';}});
    h+='</tr>';
  });
  h+='</tbody></table></div></section></main>';
  document.getElementById("root").innerHTML=h;
}

function renderGanttDay(ds,date,matchRows,showAssign){
  let h='<div class="gantt-day"><div class="gantt-title">'+fmtFull(date)+'</div>';
  matchRows.forEach(({m,slots})=>{
    const isAss=S.matchAssignments[m.id]===ds,picked=S.matchSlots[m.id];
    const bg=isAss?"#dce8fb":(m.type==="Einzel"?"#d0eddc":"#faeeda");
    const bdr=isAss?"#3a6fd8":(m.type==="Einzel"?"#3dab6b":"#c8860a");
    const txt=isAss?"#1a4fa0":(m.type==="Einzel"?"#164d2e":"#633806");
    h+='<div class="gantt-row"><div class="gantt-label"><span class="tag '+(m.type==="Einzel"?"tag-blue":"tag-green")+'">'+m.id+'</span>';
    h+='<span style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65px" title="'+m.p1+' vs '+m.p2+'">'+m.p1.split(" & ")[0].split(" ")[0]+'</span>';
    if(isAss)h+='<span style="color:#3a6fd8;font-size:11px;font-weight:700">✓</span>';
    h+='</div><div class="gantt-slots">';
    slots.forEach(sl=>{
      const isSel=isAss&&picked===sl;
      h+='<div class="gantt-slot" style="background:'+(isSel?"#3a6fd8":bg)+';border-color:'+(isSel?"#1a4fa0":bdr)+';color:'+(isSel?"#fff":txt)+';cursor:'+(showAssign?"pointer":"default")+'"';
      if(showAssign)h+=' onclick="pickSlot(\''+m.id+'\',\''+ds+'\',\''+sl+'\')" title="'+sl+'"';
      h+='>'+sl+'</div>';
    });
    h+='</div>';
    if(showAssign){
      h+='<div class="gantt-btn">';
      if(isAss){h+='<span style="font-size:11px;color:#3a6fd8;font-weight:600;white-space:nowrap">'+(picked?picked+" "+i("hr"):"–")+'</span><button class="btn btn-sm" style="background:#c0392b;color:#fff;border-color:#c0392b;font-size:11px;padding:3px 7px" onclick="unpickSlot(\''+m.id+'\')">✕</button>';}
      else{h+='<span style="font-size:11px;color:var(--faint)">← '+i("ch")+'</span>';}
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  return h;
}
function pickSlot(mid,day,time){S.matchAssignments[mid]=day;S.matchSlots[mid]=time;push().then(()=>rAdminPlan());}
function unpickSlot(mid){delete S.matchAssignments[mid];delete S.matchSlots[mid];push().then(()=>rAdminPlan());}

function rAdminPlan(){
  if(!S.settings.startDate){document.getElementById("root").innerHTML=hdr("spielplan")+'<main class="content"><div class="card"><p class="empty-state">'+i("ns")+'</p></div></main>';return;}
  const byDay=getMatchesByDay();
  let h=hdr("spielplan")+'<main class="content"><section class="card"><h2 class="card-title">'+i("pt")+'</h2><p class="card-desc">'+i("pd")+'</p>';
  if(byDay.length===0)h+='<p class="empty-state">'+i("na")+'</p>';
  else byDay.forEach(({ds,date,matches})=>{h+=renderGanttDay(ds,date,matches,true);});
  h+='</section></main>';
  document.getElementById("root").innerHTML=h;
}

function rSpielerPlan(){
  const byDay=getMatchesByDay();
  let h=hdr("spielplan")+'<main class="content"><section class="card"><h2 class="card-title">'+i("pt")+'</h2><p class="card-desc">'+i("bn")+'</p>';
  if(byDay.length===0)h+='<p class="empty-state">'+i("nc")+'</p>';
  else byDay.forEach(({ds,date,matches})=>{h+=renderGanttDay(ds,date,matches,false);});
  h+='</section></main>';
  document.getElementById("root").innerHTML=h;
}

function rAdminDoppel(){
  const days=getPlayDays(),d1=S.doubles.team1,d2=S.doubles.team2;
  let h=hdr("doppel")+'<main class="content"><section class="card"><h2 class="card-title">'+i("da")+'</h2><p class="card-desc">'+i("dd")+'</p>';
  h+='<div class="field-row" style="margin-bottom:16px"><label>Doppel</label><select id="doppel-sel" onchange="selectDoppel(this.value)" style="width:auto"><option value="">'+i("sd")+'</option>';
  for(let idx=0;idx<4;idx++){const names=[...(d1[idx]||[]),...(d2[idx]||[])].filter(p=>p).join(", ")||i("np");h+='<option value="D'+(idx+1)+'"'+(selectedDoppel==="D"+(idx+1)?" selected":"")+'>D'+(idx+1)+' — '+names+'</option>';}
  h+='</select></div>';
  if(selectedDoppel&&days.length>0){
    const dIdx=parseInt(selectedDoppel.slice(1))-1;
    const allP=[...(d1[dIdx]||[]),...(d2[dIdx]||[])].filter(p=>p);const total=allP.length;
    h+='<div style="margin-bottom:12px;font-size:13px"><strong>'+i("pl")+':</strong> '+allP.join(", ")+'</div>';
    if(total===0){h+='<p class="empty-state">'+i("np")+'</p>';}
    else{
      let hasAny=false;
      days.forEach(d=>{
        const ds=d.toISOString().slice(0,10);
        const slotData=getSlots(d.getDay()).map(sl=>{const can=allP.filter(p=>((S.availability[p]||{})[ds]||[]).includes(sl));const cant=allP.filter(p=>!((S.availability[p]||{})[ds]||[]).includes(sl));return{sl,can,cant};}).filter(x=>x.can.length>=3);
        if(slotData.length===0)return;hasAny=true;
        h+='<div style="margin-bottom:16px"><div style="font-weight:600;font-size:14px;margin-bottom:6px;color:var(--blue-text)">'+dn(d)+', '+fmt(d)+'</div>';
        slotData.forEach(({sl,can,cant})=>{
          const allCan=cant.length===0,bg=allCan?"#d0eddc":"#faeeda",bdr=allCan?"#3dab6b":"#c8860a";
          h+='<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid '+bdr+';border-radius:6px;background:'+bg+';margin-bottom:5px;flex-wrap:wrap">';
          h+='<span style="font-weight:700;font-size:13px;min-width:50px">'+sl+'</span>';
          h+='<span style="font-size:11px;padding:1px 7px;border-radius:20px;font-weight:600;background:'+bg+';color:'+(allCan?"#164d2e":"#633806")+'">'+can.length+'/'+total+'</span>';
          if(cant.length>0)h+='<span style="font-size:12px;color:#7a5c00">'+i("mi")+' <strong>'+cant.join(", ")+'</strong></span>';
          else h+='<span style="font-size:12px;color:#164d2e">'+i("af")+'</span>';
          h+='</div>';
        });
        h+='</div>';
      });
      if(!hasAny)h+='<p class="empty-state">'+i("na")+'</p>';
    }
  }else if(!selectedDoppel){h+='<p class="empty-state">'+i("cd")+'</p>';}
  else{h+='<p class="empty-state">'+i("ns")+'</p>';}
  h+='</section></main>';
  document.getElementById("root").innerHTML=h;
}
function selectDoppel(val){selectedDoppel=val;rAdminDoppel();}

function rSpiele(){
  const matches=buildMatches();
  function tbl(list){
    let h='<table class="match-table"><thead><tr><th>#</th><th>'+S.teams.team1.name+'</th><th></th><th>'+S.teams.team2.name+'</th><th>'+i("mt")+'</th></tr></thead><tbody>';
    list.forEach(m=>{const ds=S.matchAssignments[m.id],d=ds?new Date(ds):null,slot=S.matchSlots[m.id];let ts=i("nd");if(d)ts=dn(d).slice(0,2)+". "+fmt(d)+(slot?", "+slot+" "+i("hr"):"");h+='<tr><td><span class="tag '+(m.type==="Einzel"?"tag-blue":"tag-green")+'">'+m.id+'</span></td><td>'+m.p1+'</td><td class="vs-cell">vs</td><td>'+m.p2+'</td><td class="date-cell">'+ts+'</td></tr>';});
    return h+'</tbody></table>';
  }
  document.getElementById("root").innerHTML=hdr("spiele")+'<main class="content">'
    +'<section class="card"><h2 class="card-title">'+i("sg")+'</h2>'+tbl(matches.filter(m=>m.type==="Einzel"))+'</section>'
    +'<section class="card"><h2 class="card-title">'+i("dg")+'</h2>'+tbl(matches.filter(m=>m.type==="Doppel"))+'</section></main>';
}

rLogin();
</script>
