// Convert Berlin time slot to user's local time for display
function slotToLocal(slot, dateStr) {
  if(userTimezone==="Europe/Berlin") return slot;
  try {
    const [h,m] = slot.split(":").map(Number);
    // Build a date string interpreted as Berlin local time
    const berlinDt = new Date(dateStr+"T"+pad(h)+":"+pad(m)+":00");
    // Get Berlin UTC offset
    const berlinOffset = parseInt(new Date(berlinDt).toLocaleString("en-US",{timeZone:"Europe/Berlin",timeZoneName:"short"}).match(/GMT([+-]\d+)/)?.[1]||0)*60;
    const localOffset = parseInt(new Date(berlinDt).toLocaleString("en-US",{timeZone:userTimezone,timeZoneName:"short"}).match(/GMT([+-]\d+)/)?.[1]||0)*60;
    const diffMin = localOffset - berlinOffset;
    const totalMin = h*60+m+diffMin;
    const lh = Math.floor(((totalMin%1440)+1440)%1440/60);
    const lm = ((totalMin%60)+60)%60;
    return pad(lh)+":"+pad(lm);
  } catch(e) { return slot; }
}

const DAY=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

function pad(n){return n<10?"0"+n:String(n);}

function getSlots(dayIdx){
  const slots=[];
  let startMin=(dayIdx===0||dayIdx===6)?12*60:17*60;
  for(let m=startMin;m<=23*60;m+=30) slots.push(pad(Math.floor(m/60))+":"+pad(m%60));
  return slots;
}

function buildMatches(){
  const t1=S.teams.team1,t2=S.teams.team2,m=[];
  for(let i=0;i<8;i++) m.push({id:"E"+(i+1),type:"Einzel",p1:t1.players[i]||"Spieler "+(i+1),p2:t2.players[i]||"Spieler "+(i+1)});
  for(let i=0;i<4;i++){
    const d1=S.doubles.team1[i],d2=S.doubles.team2[i];
    m.push({id:"D"+(i+1),type:"Doppel",p1:(d1[0]||"S"+(2*i+1))+" & "+(d1[1]||"S"+(2*i+2)),p2:(d2[0]||"S"+(2*i+1))+" & "+(d2[1]||"S"+(2*i+2))});
  }
  return m;
}

function getPossibleSlots(m){
  const days=getPlayDays(),result=[];
  const p1n=m.p1.includes(" & ")?m.p1.split(" & "):[m.p1];
  const p2n=m.p2.includes(" & ")?m.p2.split(" & "):[m.p2];
  const names=[...p1n,...p2n].map(n=>n.trim()).filter(n=>n);
  days.forEach(d=>{
    const ds=d.toISOString().slice(0,10);
    const slots=getSlots(d.getDay());
    const common=slots.filter(t=>names.every(name=>((S.availability[name]||{})[ds]||[]).includes(t)));
    if(common.length>0) result.push({date:d,ds,slots:common});
  });
  return result;
}

function getMatchesByDay(){
  const days=getPlayDays(),matches=buildMatches(),byDay={};
  const prio=S.settings.dayPriority;
  days.forEach(d=>{
    const ds=d.toISOString().slice(0,10);
    matches.forEach(m=>{
      const p=getPossibleSlots(m).find(x=>x.ds===ds);
      if(p){if(!byDay[ds])byDay[ds]={date:d,matches:[]};byDay[ds].matches.push({m,slots:p.slots});}
    });
  });
  return Object.entries(byDay).sort((a,b)=>{
    const da=new Date(a[0]),db=new Date(b[0]);
    const ai=prio.indexOf(DAY[da.getDay()]),bi=prio.indexOf(DAY[db.getDay()]);
    if(ai!==bi) return (ai<0?99:ai)-(bi<0?99:bi);
    return a[0].localeCompare(b[0]);
  }).map(([ds,v])=>({ds,...v}));
}

}

function toggleSlot(ds,time){

// ── Gantt ────────────────────────────────────────────────────
function renderGanttDay(ds,date,matchRows,showAssign){
  let html='<div class="gantt-day"><div class="gantt-title">'+fmtFull(date)+'</div>';
  matchRows.forEach(({m,slots})=>{
    const isAss=S.matchAssignments[m.id]===ds;
    const picked=S.matchSlots[m.id];
    const bg=isAss?"#dce8fb":(m.type==="Einzel"?"#d0eddc":"#faeeda");
    const bdr=isAss?"#3a6fd8":(m.type==="Einzel"?"#3dab6b":"#c8860a");
    const txt=isAss?"#1a4fa0":(m.type==="Einzel"?"#164d2e":"#633806");
    html+='<div class="gantt-row">';
    html+='<div class="gantt-label"><span class="tag '+(m.type==="Einzel"?"tag-blue":"tag-green")+'">'+m.id+'</span>';
    html+='<span style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65px" title="'+m.p1+' vs '+m.p2+'">'+m.p1.split(" & ")[0].split(" ")[0]+'</span>';
    if(isAss)html+='<span style="color:#3a6fd8;font-size:11px;font-weight:700">✓</span>';
    html+='</div>';
    html+='<div class="gantt-slots">';
    slots.forEach(t=>{
      const isSel=isAss&&picked===t;
      const local=slotToLocal(t,ds);
      const label=(local!==t)?t+"\n"+local:t;
      html+='<div class="gantt-slot" style="background:'+(isSel?"#3a6fd8":bg)+';border-color:'+(isSel?"#1a4fa0":bdr)+';color:'+(isSel?"#fff":txt)+';cursor:'+(showAssign?"pointer":"default")+'"';
      if(showAssign)html+=' onclick="pickSlot(\''+m.id+'\',\''+ds+'\',\''+t+'\')" title="'+t+' Uhr (Berlin)"';
      html+='>'+t+'</div>';
    });
    html+='</div>';
    if(showAssign){
      html+='<div class="gantt-btn">';
      if(isAss){
        html+='<span style="font-size:11px;color:#3a6fd8;font-weight:600;white-space:nowrap">'+(picked?picked+" Uhr":"–")+'</span>';
        html+='<button class="btn btn-sm" style="background:#c0392b;color:#fff;border-color:#c0392b;font-size:11px;padding:3px 7px" onclick="unpickSlot(\''+m.id+'\')">✕</button>';
      }else{
        html+='<span style="font-size:11px;color:var(--faint)">← wählen</span>';
      }
      html+='</div>';
    }
    html+='</div>';
  });
  html+='</div>';
  return html;
}
function pickSlot(mid,day,time){S.matchAssignments[mid]=day;S.matchSlots[mid]=time;push().then(()=>rAdminPlan());}
function unpickSlot(mid){delete S.matchAssignments[mid];delete S.matchSlots[mid];push().then(()=>rAdminPlan());}

  const tzLabel=TIMEZONES.find(t=>t.value===userTimezone);
  let html=hdr("spielplan")+'<main class="content"><section class="card"><h2 class="card-title">📊 Mögliche Spieltermine</h2>';
  html+='<p class="card-desc">Zeiten in Berlin. Deine Zeitzone: <strong>'+(tzLabel?tzLabel.label:userTimezone)+'</strong>.</p>';
  if(byDay.length===0)html+='<p class="empty-state">Noch keine gemeinsamen Verfügbarkeiten.</p>';
  else byDay.forEach(({ds,date,matches})=>{html+=renderGanttDay(ds,date,matches,false);});
  html+='</section></main>';
  document.getElementById("root").innerHTML=html;
}

// ── Doppel Admin ─────────────────────────────────────────────
function rAdminDoppel(){
  const days=getPlayDays();
  const d1=S.doubles.team1,d2=S.doubles.team2;
  let html=hdr("doppel")+'<main class="content"><section class="card"><h2 class="card-title">🤝 Doppel-Verfügbarkeit</h2>';
  html+='<p class="card-desc">Wähle ein Doppel um zu sehen wann mind. 3 von 4 Spielern können.</p>';
  html+='<div class="field-row" style="margin-bottom:16px"><label>Doppel</label><select id="doppel-sel" onchange="selectDoppel(this.value)" style="width:auto"><option value="">– wählen –</option>';
  for(let i=0;i<4;i++){
    const p1=[d1[i][0],d1[i][1]].filter(p=>p);
    const p2=[d2[i][0],d2[i][1]].filter(p=>p);
    const names=[...p1,...p2].join(", ")||"(keine Spieler)";
    html+='<option value="D'+(i+1)+'"'+(selectedDoppel==="D"+(i+1)?" selected":"")+'>D'+(i+1)+' — '+names+'</option>';
  }
  html+='</select></div>';
  if(selectedDoppel&&days.length>0){
    const dIdx=parseInt(selectedDoppel.slice(1))-1;
    const allP=[...(d1[dIdx]||[]),...(d2[dIdx]||[])].filter(p=>p);
    const total=allP.length;
    html+='<div style="margin-bottom:12px;font-size:13px"><strong>Spieler:</strong> '+allP.join(", ")+'</div>';
    if(total===0){html+='<p class="empty-state">Keine Spieler eingetragen.</p>';}
    else{
      let hasAny=false;
      days.forEach(d=>{
        const ds=d.toISOString().slice(0,10);
        const slots=getSlots(d.getDay());
        const slotData=slots.map(t=>{
          const can=allP.filter(p=>((S.availability[p]||{})[ds]||[]).includes(t));
          const cant=allP.filter(p=>!((S.availability[p]||{})[ds]||[]).includes(t));
          return {t,can,cant};
        }).filter(x=>x.can.length>=3);
        if(slotData.length===0)return;
        hasAny=true;
        html+='<div style="margin-bottom:16px"><div style="font-weight:600;font-size:14px;margin-bottom:6px;color:var(--blue-text)">'+dn(d)+', '+fmt(d)+'</div>';
        slotData.forEach(({t,can,cant})=>{
          const allCan=cant.length===0;
          const bg=allCan?"#d0eddc":"#faeeda";
          const bdr=allCan?"#3dab6b":"#c8860a";
          html+='<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid '+bdr+';border-radius:6px;background:'+bg+';margin-bottom:5px;flex-wrap:wrap">';
          html+='<span style="font-weight:700;font-size:13px;min-width:50px">'+t+'</span>';
          html+='<span style="font-size:11px;background:'+(allCan?"#d0eddc":"#faeeda")+';color:'+(allCan?"#164d2e":"#633806")+';padding:1px 7px;border-radius:20px;font-weight:600">'+can.length+'/'+total+'</span>';
          if(cant.length>0)html+='<span style="font-size:12px;color:#7a5c00">Fehlt: <strong>'+cant.join(", ")+'</strong></span>';
          else html+='<span style="font-size:12px;color:#164d2e">Alle verfügbar ✓</span>';
          html+='</div>';
        });
        html+='</div>';
      });
      if(!hasAny)html+='<p class="empty-state">Noch keine Verfügbarkeiten eingetragen.</p>';
    }
  }else if(!selectedDoppel){html+='<p class="empty-state">Bitte ein Doppel auswählen.</p>';}
  else{html+='<p class="empty-state">Kein Startdatum gesetzt.</p>';}
  html+='</section></main>';
  document.getElementById("root").innerHTML=html;
}
function selectDoppel(val){selectedDoppel=val;rAdminDoppel();}

// ── Alle Spiele ──────────────────────────────────────────────
function rSpiele(){
  const matches=buildMatches();
  function tbl(list){
    let t='<table class="match-table"><thead><tr><th>#</th><th>'+S.teams.team1.name+'</th><th></th><th>'+S.teams.team2.name+'</th><th>'+T[lang].appointment+'</th></tr></thead><tbody>';
    list.forEach(m=>{
      const ds=S.matchAssignments[m.id],d=ds?new Date(ds):null;
      const slot=S.matchSlots[m.id];
      let timeStr="–";
      if(d)timeStr=dn(d).slice(0,2)+". "+fmt(d)+(slot?", "+slot+" Uhr":"");
      t+='<tr><td><span class="tag '+(m.type==="Einzel"?"tag-blue":"tag-green")+'">'+m.id+'</span></td>';
      t+='<td>'+m.p1+'</td><td class="vs-cell">vs</td><td>'+m.p2+'</td><td class="date-cell">'+timeStr+'</td></tr>';
    });
    return t+'</tbody></table>';
  }
  document.getElementById("root").innerHTML=hdr("spiele")+'<main class="content">'
    +'<section class="card"><h2 class="card-title">🏆 '+t('singles')+'</h2>'+tbl(matches.filter(m=>m.type==="Einzel"))+'</section>'
    +'<section class="card"><h2 class="card-title">🤝 '+t('doublesGames')+'</h2>'+tbl(matches.filter(m=>m.type==="Doppel"))+'</section></main>';
}

rLogin();
</script>
